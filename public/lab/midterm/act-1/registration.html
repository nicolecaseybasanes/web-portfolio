<!DOCTYPE html>
<html lang="en">


<!--Head-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTRATION</title>
</head>


<!--Body-->
<body>

    


        <!---Header ito sir -->
        <header style="background-color:rgb(189, 207, 155); text-align:center; padding:10px;"
        <h1>
            Student Registration
        </h1>
        <p>
            Welcome to Registration Page
        </p>
        </header>
        



        <!--Navigation ito sir--->
        <nav style="background-color: rgb(228, 216, 216); display:flex; justify-content:center; gap:50px; padding:10px;">
            <a href="registration.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
         </nav>

        
         <br><br>



        <!----->
        <section>
            <article>
            <form >


            <!---Input form-->    
            Full Name : <br>
            <input type="text" name="full_name" placeholder="Last Name, First Name MI."/>
            <br>
            Password:<br>
            <input type="password" name="password" placeholder="Enter your password" />
            <br>
            Email:<br>
            <input type="email" name="email" placeholder="@gmail.com"/>
            <br>
            Age:<br>
            <input type="number" name="age" placeholder="enter your age"/>




            <br><br>
            <!--Radio Button-->
            Gender:<br>
            <input type="radio" name="Gender" value="Male"> Male
            <input type="radio" name="Gender" value="Female"> Female

            
            <br>
            <br>
            <!---Drop down-->
            Year Level: <br>
            <select name="dropdown">
            <option value="Freshman" selected>Freshman</option>
            <option value="Sophomore">Sophomore</option>
            <option value="Junior" selected>Junior</option>
            <option value="Senior">Senior</option>


            <br>
            <!--Checkbox-->
            <br>
            Skills:<br>
            <input type="checkbox" name="Maths" value="on"> Maths
            <input type="checkbox" name="physics" value="on"> Physics
            <input type="checkbox" name="english" value="on"> english
            <input type="checkbox" name="science" value="on"> science


            <br>
            <!--Multi-Line--->
            Description : <br />
            <textarea rows="5" cols="50" name="description" placeholder=” Enter description here...”></textarea>


            <br>
            <br>

            <!--File Upload-->
            Upload your photo:<br>
            <input type="file" name="fileupload" accept="image/*" />

            
            <br>
            <br>
            <!--Buttons-->
            <input type="submit" name="submit" value="Submit" />
            <input type="reset" name="reset"  value="Reset" />
            <input type="button" name="ok" value="OK" />
            <input type="image" name="imagebutton" src="picture.png" width="32" height="32" />


            <br>
            <br>

            </form>
            </article>



        </section>

        <aside>

            Description : <br />
            <textarea rows="5" cols="50" name="description" placeholder=” Enter description here...”></textarea>
        </aside>


       
       
      

        <!--Footer it-->
        <footer style="background-color:rgb(201, 219, 170); text-align:center;Padding:10px;  clear:both; ">
            <h3>
                Copyright @2026
            </h3>

        </footer>
       


  
    
</body>




</html>
